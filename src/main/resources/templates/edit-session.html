<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Edit Session - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link th:href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-6 sm:py-8">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-center">Edit Session</h2>

    <form class="bg-surface p-6 sm:p-8 rounded-lg w-full max-w-sm sm:max-w-lg mx-auto"
          method="post" th:action="@{/sessions/{id}/edit(id=${sess.id})}">
        <div class="mb-4">
            <label class="block mb-2 text-sm sm:text-base" for="venue">Venue</label>
            <input class="w-full px-3 py-2 bg-surface-alt rounded" id="venue" name="venue" required
                   th:value="${sess.venue}" type="text">
        </div>

        <div class="mb-4">
            <label class="block mb-2 text-sm sm:text-base" for="startDate">Start Date</label>
            <input class="w-full px-3 py-2 bg-surface-alt rounded" id="startDate" name="startDate" required
                   th:value="${sess.startDate}" type="date">
        </div>

        <div class="mb-6">
            <label class="block mb-2 text-sm sm:text-base" for="durationHours">Duration (hours)</label>
            <input class="w-full px-3 py-2 bg-surface-alt rounded" id="durationHours" min="1" name="durationHours"
                   required th:value="${sess.durationHours}" type="number">
        </div>

        <div class="mb-6">
            <div class="flex items-center justify-between mb-2">
                <label class="text-sm sm:text-base">Anglers on This Session</label>
                <a class="text-sm bg-accent hover:bg-accent-hover text-paper font-bold py-1 px-3 rounded"
                   th:href="@{/sessions/{id}/anglers/new(id=${sess.id})}">
                    Add Angler
                </a>
            </div>
            <ul class="divide-y divide-line rounded bg-surface-alt px-3">
                <li class="flex items-center justify-between py-2" th:each="angler : ${anglers}">
                    <span th:text="${angler.name}"></span>
                    <button class="text-sm bg-danger hover:bg-danger-hover text-paper font-bold py-1 px-3 rounded"
                            formaction="#"
                            th:attr="formaction=@{/sessions/{sessionId}/anglers/{anglerId}/remove-check(sessionId=${sess.id},anglerId=${angler.id})}"
                            type="submit">
                        Remove
                    </button>
                </li>
            </ul>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <button class="flex-1 bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded" type="submit">
                Save Changes
            </button>
            <a class="flex-1 text-center bg-danger hover:bg-danger-hover text-paper font-bold py-2 px-4 rounded"
               th:href="@{/sessions/{id}(id=${sess.id})}">
                Cancel
            </a>
        </div>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
