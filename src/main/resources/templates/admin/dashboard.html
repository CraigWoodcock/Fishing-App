<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Dashboard - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta content="noindex, nofollow" name="robots">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-6 sm:py-8 max-w-6xl">

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6 sm:mb-8">
        <div>
            <span class="inline-block bg-danger text-paper text-xs font-bold uppercase tracking-wide px-2 py-1 rounded mb-2">
                Admin Panel
            </span>
            <h2 class="text-2xl sm:text-3xl font-semibold">
                Welcome, <span th:text="${#authentication.name}"></span>
            </h2>
        </div>
        <div class="flex gap-3">
            <a class="flex-1 sm:flex-none text-center bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
               th:href="@{/admin/account}">
                Account
            </a>
            <form method="post" th:action="@{/admin/logout}">
                <input class="w-full sm:w-auto bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded cursor-pointer"
                       type="submit" value="Logout"/>
            </form>
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
        <a class="bg-surface border-t-4 border-danger rounded-lg p-5 flex items-center justify-between hover:bg-accent-hover"
           th:href="@{/admin/users}">
            <div>
                <h3 class="text-lg font-semibold">Users</h3>
                <p class="text-faint text-sm" th:text="${userCount} + ' registered'"></p>
            </div>
            <span class="text-accent font-bold">Manage &rarr;</span>
        </a>

        <a class="bg-surface border-t-4 border-danger rounded-lg p-5 flex items-center justify-between hover:bg-accent-hover"
           th:href="@{/admin/sessions}">
            <div>
                <h3 class="text-lg font-semibold">Sessions</h3>
                <p class="text-faint text-sm" th:text="${sessionCount} + ' total'"></p>
            </div>
            <span class="text-accent font-bold">Manage &rarr;</span>
        </a>
        <a class="bg-surface border-t-4 border-danger rounded-lg p-5 flex items-center justify-between hover:bg-accent-hover"
           th:href="@{/admin/anglers}">
            <div>
                <h3 class="text-lg font-semibold">Anglers</h3>
                <p class="text-faint text-sm" th:text="${anglerCount} + ' registered'"></p>
            </div>
            <span class="text-accent font-bold">Manage &rarr;</span>
        </a>
    </div>

    <a class="text-accent hover:text-accent-hover hover:underline text-sm" href="/admin/register">
        + Register a new admin user
    </a>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
