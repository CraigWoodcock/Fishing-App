<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Manage Sessions - Admin - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <meta content="noindex, nofollow" name="robots">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-6 sm:py-8 max-w-6xl">

    <span class="inline-block bg-danger text-paper text-xs font-bold uppercase tracking-wide px-2 py-1 rounded mb-2">
        Admin Panel
    </span>
    <h2 class="text-2xl sm:text-3xl font-semibold mb-6">Manage Sessions</h2>

    <div class="bg-accent text-paper p-3 rounded mb-4" role="alert" th:if="${success}">
        <p th:text="${success}"></p>
    </div>

    <div class="bg-surface rounded-lg overflow-x-auto">
        <table class="w-full text-left text-sm sm:text-base">
            <thead>
            <tr class="border-b border-line">
                <th class="p-3">Venue</th>
                <th class="p-3">Owner</th>
                <th class="p-3">Date</th>
                <th class="p-3">Duration</th>
                <th class="p-3"></th>
            </tr>
            </thead>
            <tbody>
            <tr class="border-b border-line" th:each="sess : ${sessions}">
                <td class="p-3" th:text="${sess.venue}"></td>
                <td class="p-3" th:text="${sess.ownerUsername}"></td>
                <td class="p-3" th:text="${#temporals.format(sess.startDate, 'dd-MM-yyyy')}"></td>
                <td class="p-3" th:text="${sess.durationHours} + ' hours'"></td>
                <td class="p-3">
                    <form method="post" th:action="@{/admin/sessions/{id}/delete(id=${sess.id})}">
                        <button class="bg-danger hover:opacity-90 text-paper font-bold py-1 px-3 rounded"
                                type="submit">
                            Delete
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <p class="text-faint p-4" th:if="${sessions.isEmpty()}">No sessions found.</p>
    </div>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
