<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Edit User - Admin - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
    <meta content="noindex, nofollow" name="robots">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-6 sm:py-8">
    <div class="w-full max-w-sm sm:max-w-lg mx-auto">
        <span class="inline-block bg-danger text-paper text-xs font-bold uppercase tracking-wide px-2 py-1 rounded mb-4">
            Admin Panel
        </span>
        <h2 class="text-2xl sm:text-3xl font-bold mb-6" th:text="'Edit User: ' + ${user.username}"></h2>

        <div class="bg-danger text-paper p-3 rounded mb-4" role="alert" th:if="${error}">
            <p th:text="${error}"></p>
        </div>
        <div class="bg-accent text-paper p-3 rounded mb-4" role="alert" th:if="${success}">
            <p th:text="${success}"></p>
        </div>

        <form class="bg-surface p-6 sm:p-8 rounded-lg w-full mb-6"
              method="post" th:action="@{/admin/users/{id}(id=${user.id})}">

            <div class="mb-4">
                <label class="block mb-2 text-sm sm:text-base" for="name">Name</label>
                <input class="w-full px-3 py-2 bg-surface-alt rounded" id="name" name="name" required
                       th:value="${user.name}" type="text">
            </div>

            <div class="mb-4">
                <label class="block mb-2 text-sm sm:text-base" for="username">Username</label>
                <input class="w-full px-3 py-2 bg-surface-alt rounded" id="username" name="username" required
                       th:value="${user.username}" type="text">
            </div>

            <div class="mb-4">
                <label class="block mb-2 text-sm sm:text-base" for="email">Email</label>
                <input class="w-full px-3 py-2 bg-surface-alt rounded" id="email" name="email" placeholder="Enter a new email to replace the hidden one"
                       required type="email">
            </div>

            <div class="mb-6">
                <label class="block mb-2 text-sm sm:text-base" for="role">Role</label>
                <select class="w-full px-3 py-2 bg-surface-alt rounded" id="role" name="role" required>
                    <option th:selected="${user.role.name() == 'USER'}" value="USER">USER</option>
                    <option th:selected="${user.role.name() == 'ADMIN'}" value="ADMIN">ADMIN</option>
                </select>
            </div>

            <button class="w-full bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
                    type="submit">
                Save Changes
            </button>
        </form>

        <form class="bg-surface p-6 sm:p-8 rounded-lg w-full mb-6"
              method="post" th:action="@{/admin/users/{id}/password(id=${user.id})}">
            <p class="text-sm sm:text-base font-semibold mb-4">Reset Password</p>

            <div class="mb-4">
                <label class="block mb-2 text-sm sm:text-base" for="newPassword">New Password</label>
                <input class="w-full px-3 py-2 bg-surface-alt rounded" id="newPassword" name="newPassword"
                       required type="password">
            </div>

            <button class="w-full bg-danger hover:opacity-90 text-paper font-bold py-2 px-4 rounded"
                    type="submit">
                Reset Password
            </button>
        </form>

        <a class="block text-center bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
           th:href="@{/admin/users}">
            Back to Users
        </a>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
