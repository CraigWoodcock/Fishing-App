<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Dashboard - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-6 sm:py-8 max-w-6xl">

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6 sm:mb-8">
        <h2 class="text-2xl sm:text-3xl font-semibold">
            Welcome, <span th:text="${#authentication.name}"></span>!
        </h2>
        <div class="flex gap-3">
            <a class="flex-1 sm:flex-none text-center bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
               href="/account">
                Account
            </a>
            <form method="post" th:action="@{/logout}">
                <input class="w-full sm:w-auto bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded cursor-pointer"
                       type="submit" value="Logout"/>
            </form>
        </div>
    </div>

    <div class="bg-accent text-paper p-3 rounded mb-4" role="alert" th:if="${message}">
        <p th:text="${message}"></p>
    </div>

    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
        <h3 class="text-xl sm:text-2xl font-semibold">Your Sessions</h3>
        <a class="block sm:inline-block text-center bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
           href="/sessions/new">
            Add New Session
        </a>
    </div>

    <p class="text-faint" th:if="${sessions.isEmpty()}">You haven't created any sessions yet.</p>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <a class="group bg-surface border-t-4 border-accent rounded-lg p-4 sm:p-5 flex flex-col"
           th:each="sess : ${sessions}"
           th:href="@{/sessions/{id}(id=${sess.id})}">
            <h4 class="text-lg sm:text-xl font-semibold mb-3" th:text="${sess.venue}"></h4>

            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-sm text-faint mb-4">
                <p th:text="${'Date: ' + #temporals.format(sess.startDate, 'dd-MM-yyyy')}"></p>
                <div th:with="anglersList=${@sessionService.getAnglersForSession(sess.id)}">
                    <p th:text="${'Anglers: ' + anglersList.size()}"></p>
                </div>
                <p th:text="${'Duration: ' + sess.durationHours + ' hours'}"></p>

                <div th:with="totalWeight=${@sessionService.getTotalWeightForSession(sess.id)}">
                    <p th:text="${'Total Weight: ' + totalWeight}"></p>
                </div>
            </div>

            <span class="mt-auto sm:self-end sm:w-auto text-center bg-accent group-hover:bg-accent-hover text-paper font-bold py-2 px-6 rounded">
            View Details
        </span>
        </a>
    </div>

    <div class="mt-10" th:if="${not #lists.isEmpty(sharedSessions)}">
        <h3 class="text-xl sm:text-2xl font-semibold mb-6">Shared With You</h3>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <a class="group bg-surface border-t-4 border-line rounded-lg p-4 sm:p-5 flex flex-col"
               th:each="sess : ${sharedSessions}"
               th:href="@{/sessions/{id}(id=${sess.id})}">
                <h4 class="text-lg sm:text-xl font-semibold mb-3" th:text="${sess.venue}"></h4>

                <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-sm text-faint mb-4">
                    <p th:text="${'Date: ' + #temporals.format(sess.startDate, 'dd-MM-yyyy')}"></p>
                    <p th:text="${'By: ' + sess.user.name}"></p>
                    <p th:text="${'Duration: ' + sess.durationHours + ' hours'}"></p>

                    <div th:with="totalWeight=${@sessionService.getTotalWeightForSession(sess.id)}">
                        <p th:text="${'Total Weight: ' + totalWeight}"></p>
                    </div>
                </div>

                <span class="mt-auto sm:self-end sm:w-auto text-center bg-surface-alt group-hover:bg-line text-paper font-bold py-2 px-6 rounded">
                View Details
            </span>
            </a>
        </div>
    </div>

</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
