<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Add Angler - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-6 sm:py-8">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-center">Add Angler — <span
            th:text="${sess.venue}"></span></h2>

    <div class="max-w-sm sm:max-w-lg mx-auto mb-4 p-3 rounded bg-danger text-paper" th:if="${error}"
         th:text="${error}"></div>

    <form class="bg-surface p-6 sm:p-8 rounded-lg w-full max-w-sm sm:max-w-lg mx-auto"
          method="post" th:action="@{/sessions/{id}/anglers(id=${sess.id})}">
        <div class="mb-4">
            <label class="block mb-2 text-sm sm:text-base" for="name">Name</label>
            <input class="w-full px-3 py-2 bg-surface-alt rounded" id="name" name="name" required type="text">
        </div>

        <div class="mb-6">
            <label class="block mb-2 text-sm sm:text-base" for="email">Email</label>
            <input class="w-full px-3 py-2 bg-surface-alt rounded" id="email" name="email" required type="email">
            <p class="text-sm text-faint mt-1">
                Used to uniquely identify this angler. If it matches a registered account, that angler will be able to
                view this session and their catches.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <button class="flex-1 bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded" type="submit">
                Add Angler
            </button>
            <a class="flex-1 text-center bg-danger hover:bg-danger-hover text-paper font-bold py-2 px-4 rounded"
               th:href="@{/sessions/{id}(id=${sess.id})}">
                Cancel
            </a>
        </div>
    </form>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
