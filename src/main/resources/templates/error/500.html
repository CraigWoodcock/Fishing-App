<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Server Error - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow flex items-center justify-center px-4 py-8">
    <section class="bg-surface p-6 sm:p-8 rounded-lg shadow-md w-full max-w-sm sm:max-w-md text-center">
        <h2 class="text-xl sm:text-2xl font-semibold mb-4">500 - Internal Server Error</h2>
        <div class="bg-danger text-paper p-3 rounded mb-4 text-sm sm:text-base" role="alert" th:if="${message}">
            <p th:text="${message}"></p>
        </div>
        <a class="block w-full bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
           href="/dashboard">
            Back to Dashboard
        </a>
    </section>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
