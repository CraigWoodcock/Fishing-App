<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Catch Details - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-6 sm:py-8 max-w-sm sm:max-w-xl">
    <h2 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8" th:text="${catchRecord.fishType}"></h2>

    <img alt="Catch photo" class="w-full max-h-96 object-cover rounded-lg mb-6" th:if="${photoUrl}"
         th:src="${photoUrl}">
    <div class="w-full h-48 sm:h-64 bg-surface rounded-lg mb-6 flex items-center justify-center text-faint"
         th:unless="${photoUrl}">No photo
    </div>

    <div class="bg-surface p-4 sm:p-6 rounded-lg mb-8">
        <p class="mb-2 text-sm sm:text-base"><strong>Angler:</strong> <span th:text="${catchRecord.angler.name}"></span>
        </p>
        <p class="mb-2 text-sm sm:text-base"><strong>Weight:</strong> <span
                th:text="${@lbOzWeightConverter.format(catchRecord.weight)}"></span></p>
        <p class="mb-2 text-sm sm:text-base"><strong>Caught:</strong>
            <span th:text="${#temporals.format(catchRecord.catchTime, 'dd-MM-yyyy HH:mm')}"></span></p>
        <p class="mb-2 text-sm sm:text-base" th:if="${catchRecord.pegOrSwim}"><strong>Peg / Swim:</strong>
            <span th:text="${catchRecord.pegOrSwim}"></span></p>
        <p class="mb-2 text-sm sm:text-base" th:if="${catchRecord.notes}"><strong>Notes:</strong>
            <span th:text="${catchRecord.notes}"></span></p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 mb-4" th:if="${isOwner}">
        <a class="flex-1 text-center bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
           th:href="@{/sessions/{sessionId}/catches/{catchId}/edit(sessionId=${sess.id},catchId=${catchRecord.id})}">
            Edit
        </a>
    </div>

    <div class="grid grid-cols-3 gap-3 mb-8">
        <a class="text-center bg-surface-alt hover:bg-line text-paper font-bold py-2 px-2 sm:px-4 rounded text-sm sm:text-base"
           href="/dashboard">
            Dashboard
        </a>
        <a class="text-center bg-surface-alt hover:bg-line text-paper font-bold py-2 px-2 sm:px-4 rounded text-sm sm:text-base"
           th:href="@{/sessions/{id}/catches(id=${sess.id})}">
            All Catches
        </a>
        <a class="text-center bg-surface-alt hover:bg-line text-paper font-bold py-2 px-2 sm:px-4 rounded text-sm sm:text-base"
           th:href="@{/sessions/{id}(id=${sess.id})}">
            Session
        </a>
    </div>

    <div class="border border-line rounded-lg p-4 sm:p-6" th:if="${isOwner}">
        <p class="text-sm text-faint mb-3">
            Deleting a catch permanently removes it, including its photo. This cannot be undone.
        </p>
        <form method="post" onsubmit="return confirm('Delete this catch?');"
              th:action="@{/sessions/{sessionId}/catches/{catchId}/delete(sessionId=${sess.id},catchId=${catchRecord.id})}">
            <button class="bg-danger hover:bg-danger-hover text-paper font-bold py-2 px-4 rounded" type="submit">
                Delete
            </button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
