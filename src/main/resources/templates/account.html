<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>My Account - Fishing Session Tracker</title>
    <link rel="icon" th:href="@{/images/favicon-32.png}" type="image/png">
    <link th:href="@{/images/favicon-180.png}" rel="apple-touch-icon">
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col">

<div th:replace="~{fragments/layout :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-6 sm:py-8">
    <div class="w-full max-w-sm sm:max-w-lg mx-auto">
        <h2 class="text-2xl sm:text-3xl font-bold mb-6 sm:mb-8 text-center sm:text-left">My Account</h2>

        <div class="bg-danger text-paper p-3 rounded mb-4" role="alert" th:if="${error}">
            <p th:text="${error}"></p>
        </div>
        <div class="bg-accent text-paper p-3 rounded mb-4" role="alert" th:if="${message}">
            <p th:text="${message}"></p>
        </div>

        <form class="bg-surface p-6 sm:p-8 rounded-lg w-full"
              method="post" th:action="@{/account/update}">

            <div class="mb-4">
                <label class="block mb-2 text-sm sm:text-base" for="name">Name</label>
                <input class="w-full px-3 py-2 bg-surface-alt rounded" id="name" name="name" required
                       th:value="${user.name}" type="text">
            </div>

            <div class="mb-4">
                <label class="block mb-2 text-sm sm:text-base" for="username">Username</label>
                <input class="w-full px-3 py-2 bg-surface-alt rounded" id="username" name="username" required
                       th:value="${user.username}" type="text">
            </div>

            <div class="mb-6">
                <label class="block mb-2 text-sm sm:text-base" for="email">Email</label>
                <input class="w-full px-3 py-2 bg-surface-alt rounded" id="email" name="email" required
                       th:value="${user.email}" type="email">
            </div>

            <div class="border-t border-line pt-4 mb-6">
                <p class="text-sm sm:text-base font-semibold mb-1">Change Password</p>
                <p class="text-sm text-faint mb-4">Leave these blank if you don't want to change your password.</p>

                <div class="mb-4">
                    <label class="block mb-2 text-sm sm:text-base" for="currentPassword">Current Password</label>
                    <input class="w-full px-3 py-2 bg-surface-alt rounded" id="currentPassword" name="currentPassword"
                           type="password">
                </div>

                <div class="mb-4">
                    <label class="block mb-2 text-sm sm:text-base" for="newPassword">New Password</label>
                    <input class="w-full px-3 py-2 bg-surface-alt rounded" id="newPassword" name="newPassword"
                           type="password">
                </div>

                <div>
                    <label class="block mb-2 text-sm sm:text-base" for="confirmNewPassword">Confirm New Password</label>
                    <input class="w-full px-3 py-2 bg-surface-alt rounded" id="confirmNewPassword"
                           name="confirmNewPassword"
                           type="password">
                </div>
            </div>

            <div class="flex flex-col sm:flex-row gap-3">
                <button class="flex-1 bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
                        type="submit">
                    Save Changes
                </button>
                <a class="flex-1 text-center bg-accent hover:bg-accent-hover text-paper font-bold py-2 px-4 rounded"
                   href="/dashboard">
                    Back to Dashboard
                </a>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>

</body>
</html>
